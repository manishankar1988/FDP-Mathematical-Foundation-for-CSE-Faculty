<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FDP Quiz Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
/* Layout: exam hall — a quiet lobby (pick quiz, enter details), a full-screen answer sheet (one question at a time,
   timer, question palette), and a coordinator desk (quiz editor, results). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunken:#e7ecea; --ink:#13201e; --muted:#58645f; --line:#d3dbd8;
  --accent:#0d6b5c; --accent-ink:#ffffff; --accent-soft:#d8ebe6; --brass:#9a6412; --brass-soft:#f3e5c9;
  --good:#1f7a3d; --good-soft:#dbeee1; --bad:#b4372b; --bad-soft:#f5dcd8; --warn:#9a6412;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#151f1d; --sunken:#1c2826; --ink:#e2ebe8; --muted:#9aa9a5; --line:#2c3b38;
  --accent:#43bfa6; --accent-ink:#06201b; --accent-soft:#163a33; --brass:#e1a94c; --brass-soft:#3a2c14;
  --good:#5cc983; --good-soft:#163222; --bad:#ef7d70; --bad-soft:#3b1b18; --warn:#e1a94c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#151f1d; --sunken:#1c2826; --ink:#e2ebe8; --muted:#9aa9a5; --line:#2c3b38;
  --accent:#43bfa6; --accent-ink:#06201b; --accent-soft:#163a33; --brass:#e1a94c; --brass-soft:#3a2c14;
  --good:#5cc983; --good-soft:#163222; --bad:#ef7d70; --bad-soft:#3b1b18; --warn:#e1a94c; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* chrome */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--mono);flex:none}
.brand b{display:block}
.brand small{display:block;color:var(--muted);font-size:12px}
.spacer{flex:1}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:560px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 20px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:18px}
.panel p{margin:0}
.banner{border:1px dashed var(--brass);background:var(--brass-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}
.banner b{color:var(--brass)}
.err{color:var(--bad);font-size:13.5px;min-height:1.1em}
.ok{color:var(--good)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=password],textarea,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}

/* lobby */
.lobby-head h1{font-size:28px;letter-spacing:-.01em}
.lobby-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.qcard:hover{border-color:var(--accent)}
.qcard h3{font-size:17px}
.qcard p{margin:0;color:var(--muted);font-size:13.5px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted)}
.rules{margin:0;padding-left:1.2em;color:var(--muted);font-size:14px}
.rules li{margin:3px 0}

/* exam runner */
body.exam .topbar,body.exam main{display:none}
.runner{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.rbar .title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rbar .who{font-size:13px;color:var(--muted)}
.timer{font:600 18px var(--mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--sunken)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.rbody{overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:0}
.qpane{padding:32px max(16px,env(safe-area-inset-left,0px)) 32px max(24px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.qinner{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.qnum{font:500 13px var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font-family:var(--serif);font-size:24px;line-height:1.45;overflow-x:auto}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt .let{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt .otext{min-width:0;overflow-x:auto}
.palette{border-left:1px solid var(--line);background:var(--surface);padding:18px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dot{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:600 13px var(--mono);cursor:pointer;position:relative}
.dot.ans{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.dot.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.rfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--brass-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.cover{position:fixed;inset:0;z-index:40;background:rgba(8,16,14,.82);display:grid;place-items:center;padding:16px}
.cover .panel{max-width:440px}

/* result */
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunken) 0);display:grid;place-items:center}
.ring span{width:86px;height:86px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 22px var(--mono)}
.badge{display:inline-block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.badge.pass{background:var(--good-soft);color:var(--good)} .badge.fail{background:var(--bad-soft);color:var(--bad)}
.badge.on{background:var(--good-soft);color:var(--good)} .badge.off{background:var(--sunken);color:var(--muted)}
.rev{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rev .o{font-size:14px;padding:4px 8px;border-radius:6px}
.rev .o.right{background:var(--good-soft)} .rev .o.wrong{background:var(--bad-soft)}

/* coordinator */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
table.data th{background:var(--sunken);font-weight:600;font-size:12px}
table.data td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.data td.wrap{white-space:normal;min-width:200px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.qedit{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.qedit header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qedit header b{font:600 13px var(--mono)}
.oprow{display:grid;grid-template-columns:auto 28px minmax(0,1fr) auto;gap:8px;align-items:center}
.oprow .l{font:600 13px var(--mono);color:var(--muted);text-align:center}
.oprow input[type=radio]{accent-color:var(--good);width:18px;height:18px}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
pre.code{background:var(--sunken);border-radius:8px;padding:10px;font:12.5px/1.5 var(--mono);overflow-x:auto;margin:0;white-space:pre}

@media (max-width:820px){
  .rbody{grid-template-columns:1fr}
  .palette{border-left:0;border-top:1px solid var(--line)}
  .dots{grid-template-columns:repeat(8,1fr)}
  .qtext{font-size:20px}
  .opt{font-size:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){ .grid2,.grid3{grid-template-columns:1fr} .result{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#home"><span class="mark">Q</span><span><b id="appTitle">FDP Quiz Hall</b><small id="appOrg"></small></span></a>
  <span class="spacer"></span>
  <a class="btn ghost small" href="#admin" id="coordLink">Coordinator</a>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="runnerHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   SETTINGS — the only part you need to edit before uploading to GitHub
   ===================================================================== */
const CONFIG = {
  SCRIPT_URL: "",   // Google Apps Script web-app URL (from QuizBackend.gs). Empty = demo mode on this browser only.
  APP_TITLE: "FDP Quiz Hall",
  ORG: "Department of CSE · Sahrdaya College of Engineering and Technology",
  DEMO_PIN: "2026"  // coordinator PIN used only in demo mode (with SCRIPT_URL set, the key lives in the Apps Script)
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const rich = s => esc(s).replace(/\n/g, "<br>");      // question text: escaped, line breaks kept, $math$ rendered by KaTeX
const LET = "ABCDEF";
const DEMO = !CONFIG.SCRIPT_URL;
function readJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
function math(el){
  if(!el) return;
  if(window.renderMathInElement){ try{ renderMathInElement(el, { delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false }); }catch(e){} }
  else setTimeout(() => math(el), 300);
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32) || "quiz"; }
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtTime(sec){ sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
function copyText(t){
  const done = () => toast("Link copied.");
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast(t));
  else toast(t);
}
function quizLink(id){ return location.origin + location.pathname + "#quiz-" + id; }

/* =====================================================================
   DATA LAYER — remote (Google Sheet) or demo (this browser)
   ===================================================================== */
const remote = {
  async get(params){
    const r = await fetch(CONFIG.SCRIPT_URL + "?" + new URLSearchParams(params));
    return r.json();
  },
  async post(body){
    const r = await fetch(CONFIG.SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    return r.json();
  },
  listQuizzes(){ return this.get({ action:"quizzes" }); },
  getQuiz(id, emp){ return this.get({ action:"quiz", id, emp }); },
  submit(p){ return this.post(Object.assign({ action:"submit" }, p)); },
  adminLoad(key){ return this.post({ action:"adminLoad", key }); },
  adminSave(key, quiz){ return this.post({ action:"adminSaveQuiz", key, quiz }); },
  adminDelete(key, id){ return this.post({ action:"adminDeleteQuiz", key, id }); },
  adminResults(key, id){ return this.post({ action:"adminResults", key, id }); }
};

const local = {
  quizzes(){ let q = readJSON("fq:quizzes", null); if(!q){ q = SEED; writeJSON("fq:quizzes", q); } return q; },
  responses(){ return readJSON("fq:responses", []); },
  async listQuizzes(){ return { quizzes: this.quizzes().filter(q => q.open).map(q => ({ id:q.id, title:q.title, description:q.description, timeLimit:q.timeLimit, count:q.questions.length })) }; },
  async getQuiz(id, emp){
    const q = this.quizzes().find(x => x.id === id);
    if(!q) return { error:"This quiz does not exist. Check the link with your coordinator." };
    if(!q.open) return { error:"This quiz is not open right now." };
    if(q.oneAttempt && emp && this.responses().some(r => r.quizId === id && r.emp.toLowerCase() === String(emp).toLowerCase())) return { error:"You have already submitted this quiz. Only one attempt is allowed." };
    let qs = q.questions.map(x => ({ qid:x.qid, text:x.text, options:x.options }));
    if(q.shuffle) qs = shuffle(qs);
    return { quiz:{ id:q.id, title:q.title, description:q.description, timeLimit:q.timeLimit, passPercent:q.passPercent, count:qs.length }, questions:qs };
  },
  async submit(p){
    const q = this.quizzes().find(x => x.id === p.quizId);
    if(!q) return { error:"This quiz no longer exists." };
    if(!q.open) return { error:"This quiz has been closed by the coordinator." };
    let score = 0, total = 0;
    const review = q.questions.map(x => {
      const chosen = p.answers[x.qid] ?? -1; const m = Number(x.marks) || 1; total += m; if(chosen === x.correct) score += m;
      return { qid:x.qid, text:x.text, options:x.options, correct:x.correct, chosen, explanation:x.explanation };
    });
    const percent = total ? Math.round(score / total * 100) : 0, passed = percent >= q.passPercent;
    const rs = this.responses();
    rs.push({ time:new Date().toISOString(), quizId:q.id, quizTitle:q.title, name:p.name, emp:p.emp, dept:p.dept, score, total, percent, passed: passed ? "Yes" : "No",
      timeTakenSec:p.timeTaken, fullscreenExits:p.exits, tabSwitches:p.switches,
      answers:q.questions.map(x => x.qid + ":" + (p.answers[x.qid] === undefined ? "-" : LET[p.answers[x.qid]])).join(" ") });
    writeJSON("fq:responses", rs);
    if(!q.showScore) return { submitted:true, showScore:false };
    return { submitted:true, showScore:true, score, total, percent, passed, passPercent:q.passPercent, review: q.showReview ? review : null };
  },
  async adminLoad(key){
    if(key !== CONFIG.DEMO_PIN) return { error:"That PIN is not correct." };
    const rs = this.responses();
    return { quizzes: this.quizzes().map(q => Object.assign({}, q, { responses: rs.filter(r => r.quizId === q.id).length })) };
  },
  async adminSave(key, quiz){
    if(key !== CONFIG.DEMO_PIN) return { error:"That PIN is not correct." };
    const qs = this.quizzes().filter(q => q.id !== quiz.id); qs.push(quiz); writeJSON("fq:quizzes", qs); return { ok:true };
  },
  async adminDelete(key, id){
    if(key !== CONFIG.DEMO_PIN) return { error:"That PIN is not correct." };
    writeJSON("fq:quizzes", this.quizzes().filter(q => q.id !== id)); return { ok:true };
  },
  async adminResults(key, id){
    if(key !== CONFIG.DEMO_PIN) return { error:"That PIN is not correct." };
    return { rows: this.responses().filter(r => r.quizId === id) };
  }
};
const API = DEMO ? local : remote;
async function call(fn){
  try{ const r = await fn(); return r || { error:"No response from the quiz server." }; }
  catch(e){ return { error: DEMO ? String(e) : "Could not reach the quiz server. Check your internet connection and try again." }; }
}

/* =====================================================================
   SAMPLE QUIZZES (used only in demo mode, before the Google Sheet is connected)
   ===================================================================== */
const N = String.raw;
const SEED = [
  { id:"la-day1", title:"Linear Algebra · Day 1 (16 Nov)", description:"Systems, matrices and subspaces. 8 questions, 15 minutes.",
    open:true, timeLimit:15, showScore:true, showReview:true, oneAttempt:false, shuffle:false, passPercent:60, questions:[
    { qid:"q1", text:N`In the column picture, the product $Ax$ is:`, options:["A dot product of x with each column","A combination of the columns of A with weights from x","The intersection of the rows of A","The transpose of A times x"], correct:1, explanation:"Ax = x₁(column 1) + x₂(column 2) + …", marks:1 },

function route(){
  const h = location.hash || "#home";
  if(RUN.active) return;            // never navigate away from a running quiz
  let m;
  if(h === "#admin") return viewAdmin();
  if((m = h.match(/^#edit-(.+)$/))) return viewEditor(decodeURIComponent(m[1]));
  if(h === "#new") return viewEditor(null);
  if((m = h.match(/^#results-(.+)$/))) return viewResults(decodeURIComponent(m[1]));
  if((m = h.match(/^#quiz-(.+)$/))) return viewStart(decodeURIComponent(m[1]));
  return viewHome();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

function demoBanner(){
  return DEMO ? `<div class="banner"><b>Demo mode.</b> No Google Sheet is connected yet, so quizzes and scores are stored only in this browser. Coordinator PIN in demo mode: <span class="mono">${esc(CONFIG.DEMO_PIN)}</span>. Connect the sheet (see the Coordinator page) before sharing the link.</div>` : "";
}

function viewStart(id){

    <form class="panel" id="startForm" novalidate>
      <div class="eyebrow">Quiz</div><h2 id="sTitle">Loading…</h2><p class="muted" id="sDesc"></p>

        <li id="ruleTime" hidden>When the timer reaches zero, your answers are submitted automatically.</li>
      </ul>
      <div class="field"><label for="pName">Full name</label><input type="text" id="pName" autocomplete="name" value="${esc(me.name || "")}"></div>
      <div class="grid2"><div class="field"><label for="pEmp">Employee ID</label><input type="text" id="pEmp" value="${esc(me.emp || "")}"></div>
      <div class="field"><label for="pDept">Department</label><input type="text" id="pDept" value="${esc(me.dept || "CSE")}"></div></div>
      <div class="err" id="sErr"></div>
      <button class="btn primary big" type="submit" id="startBtn" disabled>Start in full screen</button>
      <a href="#home" class="btn ghost small" style="align-self:flex-start">← All quizzes</a>
    </form></div>`;
  // preview (no answers) to show title and size
  call(() => API.getQuiz(id, "")).then(r => {
    if(r.error){ $("#sTitle").textContent = "Quiz unavailable"; $("#sErr").textContent = r.error; return; }
    $("#sTitle").innerHTML = rich(r.quiz.title); $("#sDesc").innerHTML = rich(r.quiz.description || "");
    $("#sMeta").innerHTML = `<span>${r.quiz.count} questions</span><span>${r.quiz.timeLimit ? r.quiz.timeLimit + " minutes" : "No time limit"}</span><span>Pass mark ${r.quiz.passPercent}%</span>`;
    $("#ruleTime").hidden = !r.quiz.timeLimit;
    $("#startBtn").disabled = false; math($("#startForm"));
  });
  $("#startForm").onsubmit = async e => {
    e.preventDefault();
    const name = $("#pName").value.trim(), emp = $("#pEmp").value.trim(), dept = $("#pDept").value.trim();
    if(!name || !emp){ $("#sErr").textContent = "Enter your name and employee ID to start."; return; }
    writeJSON("fq:me", { name, emp, dept });
    // request full screen inside the click, before any await, so the browser allows it
    const fsReq = enterFullscreen();
    $("#startBtn").disabled = true; $("#sErr").textContent = "";
    const r = await call(() => API.getQuiz(id, emp));
    if(r.error){ exitFullscreen(); $("#sErr").textContent = r.error; $("#startBtn").disabled = false; return; }
    if(!r.questions.length){ exitFullscreen(); $("#sErr").textContent = "This quiz has no questions yet."; $("#startBtn").disabled = false; return; }
    await fsReq;
    startRun(r, { name, emp, dept });
  };
}

/* =====================================================================
   PARTICIPANT: FULL-SCREEN RUNNER
   ===================================================================== */
const RUN = { active:false };
function fsSupported(){ return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
function enterFullscreen(){
  const el = document.documentElement;
  try{
    const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI:"hide" }) : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null;
    return p && p.catch ? p.catch(() => {}) : Promise.resolve();
  }catch(e){ return Promise.resolve(); }
}
function exitFullscreen(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
function isFull(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }

function startRun(data, who){
  const saveKey = `fq:prog:${data.quiz.id}:${who.emp.toLowerCase()}`;
  const saved = readJSON(saveKey, null);
  const resume = saved && saved.order && saved.order.length === data.questions.length && (!data.quiz.timeLimit || Date.now() < saved.startedAt + data.quiz.timeLimit * 60000);
  let questions = data.questions;
  if(resume){ const byId = Object.fromEntries(questions.map(q => [q.qid, q])); if(saved.order.every(id => byId[id])) questions = saved.order.map(id => byId[id]); }
  Object.assign(RUN, {
    active:true, quiz:data.quiz, questions, who, saveKey, idx: resume ? saved.idx || 0 : 0,
    answers: resume ? saved.answers : {}, flags: resume ? saved.flags || {} : {},
    startedAt: resume ? saved.startedAt : Date.now(), exits: resume ? saved.exits || 0 : 0, switches: resume ? saved.switches || 0 : 0,
    submitting:false, confirm:false
  });
  if(resume) toast("Your earlier answers were restored.");
  document.body.classList.add("exam");
  $("#runnerHost").innerHTML = `<section class="runner" id="runner" aria-label="Quiz">
    <div class="rbar"><span class="title">${rich(RUN.quiz.title)}</span><span class="who">${esc(who.name)} · ${esc(who.emp)}</span>
      <span class="timer" id="timer" ${RUN.quiz.timeLimit ? "" : "hidden"}>--:--</span></div>
    <div class="rbody"><div class="qpane"><div class="qinner" id="qinner"></div></div>
      <aside class="palette"><div class="eyebrow">Questions</div><div class="dots" id="dots"></div>
        <div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>Answered</span>
        <span><i></i>Not answered</span><span><i style="background:var(--brass);border-color:var(--brass);border-radius:50%"></i>Marked for review</span></div>
        <div class="hint">Keys: A–F to answer, ← → to move.</div></aside></div>
    <div class="rfoot" id="rfoot"></div></section>
    <div class="cover" id="fsCover" hidden><div class="panel"><h2>You left full screen</h2>
      <p class="muted">This has been noted for the coordinator. Return to full screen to continue the quiz. Your answers are safe.</p>
      <button class="btn primary big" id="fsBack">Return to full screen</button></div></div>`;
  $("#fsBack").onclick = () => { enterFullscreen().then(() => { if(isFull() || !fsSupported()) $("#fsCover").hidden = true; }); };
  renderQ(); persist();
  if(RUN.quiz.timeLimit){ tick(); RUN.timer = setInterval(tick, 1000); }
  if(fsSupported() && !isFull()) $("#fsCover").hidden = false;
}
function persist(){ writeJSON(RUN.saveKey, { order:RUN.questions.map(q => q.qid), idx:RUN.idx, answers:RUN.answers, flags:RUN.flags, startedAt:RUN.startedAt, exits:RUN.exits, switches:RUN.switches }); }
function remaining(){ return RUN.quiz.timeLimit * 60 - (Date.now() - RUN.startedAt) / 1000; }
function tick(){
  const left = remaining(), t = $("#timer");
  if(!t) return;
  t.textContent = fmtTime(left); t.classList.toggle("low", left <= 60);
  if(left <= 0 && !RUN.submitting){ clearInterval(RUN.timer); toast("Time is up. Submitting your answers."); doSubmit(true); }
}
function renderQ(){
  const q = RUN.questions[RUN.idx], n = RUN.questions.length;
  const chosen = RUN.answers[q.qid];
  $("#qinner").innerHTML = `<div class="qnum"><span>Question ${RUN.idx + 1} of ${n}</span>
      <button class="btn ghost small" id="flagBtn" type="button">${RUN.flags[q.qid] ? "★ Marked for review" : "☆ Mark for review"}</button></div>
    <div class="qtext" id="qtext">${rich(q.text)}</div>
    <div class="options" role="radiogroup" aria-label="Options">${q.options.map((o, i) => `<button type="button" role="radio" aria-checked="${chosen === i}" class="opt ${chosen === i ? "sel" : ""}" data-i="${i}"><span class="let">${LET[i]}</span><span class="otext">${rich(o)}</span></button>`).join("")}</div>
    ${chosen !== undefined ? `<button class="btn ghost small" id="clearBtn" type="button" style="align-self:flex-start">Clear answer</button>` : ""}`;
  math($("#qinner"));
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  $("#flagBtn").onclick = () => { RUN.flags[q.qid] = !RUN.flags[q.qid]; persist(); renderQ(); };
  const cb = $("#clearBtn"); if(cb) cb.onclick = () => { delete RUN.answers[q.qid]; persist(); renderQ(); };
  $("#dots").innerHTML = RUN.questions.map((x, i) => `<button type="button" class="dot ${RUN.answers[x.qid] !== undefined ? "ans" : ""} ${i === RUN.idx ? "cur" : ""} ${RUN.flags[x.qid] ? "flag" : ""}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("");
  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { RUN.idx = +b.dataset.i; RUN.confirm = false; persist(); renderQ(); });
  renderFoot();
}
function renderFoot(){
  const n = RUN.questions.length, answered = RUN.questions.filter(x => RUN.answers[x.qid] !== undefined).length;
  const f = $("#rfoot");
  if(RUN.confirm){
    const left = n - answered;
    f.innerHTML = `<div class="confirm"><span>${left ? `<b>${left} question${left > 1 ? "s" : ""} not answered.</b> ` : ""}Submit your answers now? You cannot change them afterwards.</span>
      <button class="btn small" id="noBtn" type="button">Keep answering</button><button class="btn primary small" id="yesBtn" type="button">Submit</button></div>`;
    $("#noBtn").onclick = () => { RUN.confirm = false; renderFoot(); };
    $("#yesBtn").onclick = () => doSubmit(false);
    return;
  }
  f.innerHTML = `<button class="btn" id="prevBtn" type="button" ${RUN.idx === 0 ? "disabled" : ""}>← Previous</button>
    <button class="btn" id="nextBtn" type="button" ${RUN.idx === n - 1 ? "disabled" : ""}>Next →</button>
    <span class="spacer"></span><span class="muted mono" style="font-size:13px">${answered}/${n} answered</span>
    <button class="btn primary" id="subBtn" type="button">Submit quiz</button>`;
  $("#prevBtn").onclick = () => move(-1); $("#nextBtn").onclick = () => move(1);
  $("#subBtn").onclick = () => { RUN.confirm = true; renderFoot(); };
}
function choose(i){
  const q = RUN.questions[RUN.idx]; if(i >= q.options.length) return;
  RUN.answers[q.qid] = i; persist(); renderQ();
}
function move(d){ const n = RUN.questions.length; RUN.idx = Math.max(0, Math.min(n - 1, RUN.idx + d)); RUN.confirm = false; persist(); renderQ(); }
document.addEventListener("keydown", e => {
  if(!RUN.active || RUN.submitting || e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  const k = e.key.toUpperCase();
  if(LET.includes(k) && k.length === 1){ choose(LET.indexOf(k)); e.preventDefault(); }
  else if(/^[1-6]$/.test(k)){ choose(+k - 1); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ move(1); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ move(-1); e.preventDefault(); }
});
function onFsChange(){
  if(!RUN.active || RUN.submitting) return;
  if(!isFull()){ RUN.exits++; persist(); const c = $("#fsCover"); if(c) c.hidden = false; }
  else { const c = $("#fsCover"); if(c) c.hidden = true; }
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
document.addEventListener("visibilitychange", () => { if(RUN.active && !RUN.submitting && document.hidden){ RUN.switches++; persist(); } });
window.addEventListener("beforeunload", e => { if(RUN.active && !RUN.submitting){ e.preventDefault(); e.returnValue = ""; } });

async function doSubmit(auto){
  if(RUN.submitting) return;
  RUN.submitting = true;
  const f = $("#rfoot");
  f.innerHTML = `<span class="muted">Submitting your answers…</span>`;
  const payload = { quizId:RUN.quiz.id, name:RUN.who.name, emp:RUN.who.emp, dept:RUN.who.dept, answers:RUN.answers,
    timeTaken: Math.round((Date.now() - RUN.startedAt) / 1000), exits:RUN.exits, switches:RUN.switches };
  const r = await call(() => API.submit(payload));
  if(r.error){
    RUN.submitting = false;
    f.innerHTML = `<span class="err" style="flex:1">${esc(r.error)} Your answers are saved on this device.</span><button class="btn primary" id="retryBtn" type="button">Try again</button>`;
    $("#retryBtn").onclick = () => doSubmit(auto);
    return;
  }
  clearInterval(RUN.timer);
  try{ localStorage.removeItem(RUN.saveKey); }catch(e){}
  RUN.active = false;
  exitFullscreen();
  document.body.classList.remove("exam");
  $("#runnerHost").innerHTML = "";
  showResult(r, auto);
}
function showResult(r, auto){
  history.replaceState(null, "", "#done");
  let html = `<div class="wrap" style="margin:0 auto;max-width:760px">`;
  if(!r.showScore){
    html += `<div class="panel"><span class="badge pass">Submitted</span><h2>Thank you, ${esc(RUN.who.name)}</h2>
      <p class="muted">${auto ? "Time ran out and your answers were submitted automatically. " : ""}Your answers have been recorded. The coordinator will share the results.</p>
      <a class="btn" href="#home" style="align-self:flex-start">Back to quizzes</a></div>`;
  } else {
    html += `<div class="panel"><div class="result"><div class="ring" style="--p:${r.percent}"><span>${r.score}/${r.total}</span></div>
      <div><span class="badge ${r.passed ? "pass" : "fail"}">${r.passed ? "Passed" : "Below pass mark"}</span>
      <h2 style="margin:6px 0 4px">${r.percent}% · ${esc(RUN.quiz.title)}</h2>
      <p class="muted">${auto ? "Time ran out and your answers were submitted automatically. " : ""}Your score has been sent to the coordinator. Pass mark ${r.passPercent}%.</p>
      <div class="row" style="margin-top:10px"><a class="btn" href="#home">Back to quizzes</a></div></div></div></div>`;
    if(r.review){
      html += `<div class="panel" id="review"><h2>Answer review</h2>` + r.review.map((q, i) => `<div class="rev"><div class="eyebrow">Question ${i + 1} · ${q.chosen === q.correct ? '<span class="ok">Correct</span>' : '<span class="err">' + (q.chosen < 0 ? "Not answered" : "Incorrect") + "</span>"}</div>
        <div>${rich(q.text)}</div>${q.options.map((o, j) => `<div class="o ${j === q.correct ? "right" : j === q.chosen ? "wrong" : ""}"><b class="mono">${LET[j]}.</b> ${rich(o)}${j === q.correct ? " ✓" : j === q.chosen ? " (your answer)" : ""}</div>`).join("")}
        ${q.explanation ? `<div class="muted" style="font-size:13.5px">${rich(q.explanation)}</div>` : ""}</div>`).join("") + `</div>`;
    }
  }
  html += `</div>`;
  $("#view").innerHTML = html; math($("#view")); window.scrollTo(0, 0);
}

  qs.forEach(q => {
    html += `<tr><td class="wrap"><b>${rich(q.title)}</b><div class="mono muted" style="font-size:12px">${esc(q.id)}</div></td>
      <td><button class="btn small" data-toggle="${esc(q.id)}" title="Click to ${q.open ? "close" : "open"}"><span class="badge ${q.open ? "on" : "off"}">${q.open ? "Open" : "Closed"}</span></button></td>
      <td class="num">${q.questions.length}</td><td class="num">${q.timeLimit ? q.timeLimit + " min" : "–"}</td><td class="num">${q.responses || 0}</td>
      <td><div class="row"><a class="btn small" href="#edit-${encodeURIComponent(q.id)}">Edit</a><a class="btn small" href="#results-${encodeURIComponent(q.id)}">Results</a>
      <button class="btn small" data-copy="${esc(q.id)}">Copy link</button></div></td></tr>`;
  });
  html += `</tbody></table></div>${setupPanel()}`;
  $("#view").innerHTML = html; math($("#view"));
  $("#signOut").onclick = () => { ADMIN = { key:null, quizzes:null }; try{ sessionStorage.removeItem("fq:key"); }catch(e){} location.hash = "#home"; };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(quizLink(b.dataset.copy)));
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
    const q = ADMIN.quizzes.find(x => x.id === b.dataset.toggle); const copy = Object.assign({}, q, { open: !q.open }); delete copy.responses;
    b.disabled = true; const r = await call(() => API.adminSave(ADMIN.key, copy));
    if(r.error){ toast(r.error); b.disabled = false; return; }
    toast(copy.open ? "Quiz opened for participants." : "Quiz closed."); viewAdmin();
  });
}
function setupPanel(){
  return `<div class="panel"><h2>${DEMO ? "Connect the Google Sheet before sharing" : "Connected to Google Sheets"}</h2>
    ${DEMO ? `<p class="muted">Right now everything is stored in this browser only, so participants' scores cannot reach you. To collect scores in one place:</p>
    <ol class="rules" style="color:var(--ink)"><li>Create a Google Sheet → Extensions → Apps Script, paste <span class="mono">QuizBackend.gs</span>, and set your own <span class="mono">ADMIN_KEY</span>.</li>
    <li>Deploy → New deployment → Web app (Execute as: Me, Who has access: Anyone). Copy the URL ending in <span class="mono">/exec</span>.</li>
    <li>Open <span class="mono">index.html</span>, paste the URL into <span class="mono">SCRIPT_URL</span> in the settings at the top of the script, and upload it to GitHub.</li></ol>`
    : `<p class="muted">Quizzes, questions and every submission are stored in your Google Sheet (tabs: Quizzes, Questions, Responses). Correct answers stay in the sheet and are never sent to participants before they submit.</p>`}</div>`;
}

/* ---------- quiz editor ---------- */
let ED = null;
async function viewEditor(id){
  const qs = await loadAdmin(false); if(!qs) return;
  if(id){ const q = qs.find(x => x.id === id); if(!q){ toast("Quiz not found."); location.hash = "#admin"; return; } ED = JSON.parse(JSON.stringify(q)); delete ED.responses; ED.isNew = false; }
  else ED = { id:"", title:"", description:"", open:false, timeLimit:15, showScore:true, showReview:true, oneAttempt:true, shuffle:false, passPercent:60,
    questions:[{ qid:"q1", text:"", options:["", "", "", ""], correct:-1, explanation:"", marks:1 }], isNew:true };
  renderEditor();
}
function renderEditor(){
  const e = ED;
  $("#view").innerHTML = `<section class="row" style="justify-content:space-between"><div><div class="eyebrow"><a href="#admin">Coordinator</a> / ${e.isNew ? "New quiz" : "Edit quiz"}</div>
      <h1 style="font-size:24px">${e.isNew ? "Create a quiz" : rich(e.title)}</h1></div>
      <div class="row"><a class="btn" href="#admin">Cancel</a><button class="btn primary" id="saveTop">Save quiz</button></div></section>
    <div class="panel"><h2>Quiz settings</h2>
      <div class="field"><label for="eTitle">Title</label><input type="text" id="eTitle" value="${esc(e.title)}" placeholder="e.g. Discrete Mathematics · 20 Nov"></div>
      <div class="field"><label for="eDesc">Short description (shown to participants)</label><input type="text" id="eDesc" value="${esc(e.description)}"></div>
      <div class="grid3">
        <div class="field"><label for="eTime">Time limit (minutes)</label><input type="number" id="eTime" min="0" value="${e.timeLimit}"><small>0 = no limit</small></div>
        <div class="field"><label for="ePass">Pass mark (%)</label><input type="number" id="ePass" min="0" max="100" value="${e.passPercent}"></div>
        <div class="field"><label>Quiz ID</label><input type="text" value="${esc(e.id || "set from the title on save")}" disabled><small>Used in the participant link</small></div>
      </div>
      <div class="grid2">
        <label class="check"><input type="checkbox" id="eOpen" ${e.open ? "checked" : ""}><span><b>Open for participants</b><br><span class="muted">Closed quizzes cannot be started or submitted.</span></span></label>
        <label class="check"><input type="checkbox" id="eOne" ${e.oneAttempt ? "checked" : ""}><span><b>One attempt per employee ID</b></span></label>
        <label class="check"><input type="checkbox" id="eScore" ${e.showScore ? "checked" : ""}><span><b>Show score after submitting</b></span></label>
        <label class="check"><input type="checkbox" id="eReview" ${e.showReview ? "checked" : ""}><span><b>Show correct answers after submitting</b><br><span class="muted">Needs “Show score”.</span></span></label>
        <label class="check"><input type="checkbox" id="eShuffle" ${e.shuffle ? "checked" : ""}><span><b>Shuffle question order</b></span></label>
      </div></div>
    <div class="panel"><div class="row" style="justify-content:space-between"><h2>Questions (<span id="qCount">${e.questions.length}</span>)</h2>
      <div class="row"><button class="btn" id="addQ">+ Add question</button><button class="btn" id="impToggle">Import from spreadsheet</button></div></div>
      <p class="hint">Write maths between dollar signs, e.g. <span class="mono">$A^{-1}$</span> or <span class="mono">$\\det(A) = 0$</span>. Select the radio button next to the correct option.</p>
      <div id="impBox" hidden class="qedit"><b>Paste rows from Excel or Google Sheets</b>
        <p class="hint">Columns in this order: Question · Option A · Option B · Option C · Option D · Correct (A–D) · Explanation (optional). Tab-separated (copied cells) or comma-separated with quotes both work. A header row is skipped automatically.</p>
        <textarea id="impText" rows="6" placeholder="What is 2 + 2?&#9;3&#9;4&#9;5&#9;6&#9;B&#9;Basic addition"></textarea>
        <div class="row"><button class="btn primary small" id="impGo">Add these questions</button><span class="err" id="impErr"></span></div></div>
      <div id="qList" style="display:flex;flex-direction:column;gap:12px"></div>
      <button class="btn" id="addQ2" style="align-self:flex-start">+ Add question</button></div>
    <div class="row" style="justify-content:space-between"><div class="row"><button class="btn primary" id="saveBot">Save quiz</button><a class="btn" href="#admin">Cancel</a></div>
      ${e.isNew ? "" : `<button class="btn danger" id="delQuiz">Delete quiz</button>`}</div>
    <div class="err" id="eErr"></div>`;
  renderQList();
  const sync = () => {
    e.title = $("#eTitle").value.trim(); e.description = $("#eDesc").value.trim();
    e.timeLimit = Math.max(0, parseInt($("#eTime").value, 10) || 0); e.passPercent = Math.min(100, Math.max(0, parseInt($("#ePass").value, 10) || 0));
    e.open = $("#eOpen").checked; e.oneAttempt = $("#eOne").checked; e.showScore = $("#eScore").checked; e.showReview = $("#eReview").checked; e.shuffle = $("#eShuffle").checked;
  };
  ["eTitle","eDesc","eTime","ePass","eOpen","eOne","eScore","eReview","eShuffle"].forEach(id => $("#" + id).addEventListener("input", sync));
  const add = () => { e.questions.push({ qid:"", text:"", options:["", "", "", ""], correct:-1, explanation:"", marks:1 }); renderQList(); $("#qList").lastElementChild.querySelector("textarea").focus(); };
  $("#addQ").onclick = add; $("#addQ2").onclick = add;
  $("#impToggle").onclick = () => { $("#impBox").hidden = !$("#impBox").hidden; };
  $("#impGo").onclick = () => {
    const rows = parseTable($("#impText").value); let added = 0, bad = [];
    rows.forEach((r, i) => {
      if(i === 0 && /question/i.test(r[0] || "") && /option|^a$/i.test(r[1] || "")) return;
      const opts = r.slice(1, 5).map(s => (s || "").trim()).filter(Boolean), c = LET.indexOf(String(r[5] || "").trim().toUpperCase());
      if(!(r[0] || "").trim() || opts.length < 2 || c < 0 || c >= opts.length){ bad.push(i + 1); return; }
      e.questions.push({ qid:"", text:r[0].trim(), options:opts, correct:c, explanation:(r[6] || "").trim(), marks:1 }); added++;
    });
    e.questions = e.questions.filter(q => q.text.trim() || q.options.some(o => o.trim()));
    renderQList();
    $("#impErr").textContent = bad.length ? `Skipped row${bad.length > 1 ? "s" : ""} ${bad.join(", ")}: each row needs a question, at least two options and a correct letter.` : "";
    if(added){ toast(`${added} question${added > 1 ? "s" : ""} added.`); if(!bad.length){ $("#impText").value = ""; $("#impBox").hidden = true; } }
  };
  const save = async () => {
    sync();
    const err = validate(e); if(err){ $("#eErr").textContent = err; toast(err); return; }
    if(e.isNew){ let base = slug(e.title), id = base, n = 2; while(ADMIN.quizzes.some(q => q.id === id)) id = base + "-" + n++; e.id = id; }
    const used = new Set(); e.questions.forEach((q, i) => { if(!q.qid || used.has(q.qid)){ let k = i + 1; while(used.has("q" + k) || e.questions.some(x => x !== q && x.qid === "q" + k)) k++; q.qid = "q" + k; } used.add(q.qid); });
    const out = JSON.parse(JSON.stringify(e)); delete out.isNew;
    $("#saveTop").disabled = $("#saveBot").disabled = true;
    const r = await call(() => API.adminSave(ADMIN.key, out));
    $("#saveTop").disabled = $("#saveBot").disabled = false;
    if(r.error){ $("#eErr").textContent = r.error; toast(r.error); return; }
    ADMIN.quizzes = null; toast("Quiz saved."); location.hash = "#admin";
  };
  $("#saveTop").onclick = save; $("#saveBot").onclick = save;
  const del = $("#delQuiz");
  if(del) del.onclick = async () => {
    if(!del.dataset.armed){ del.dataset.armed = "1"; del.textContent = "Click again to delete permanently"; $("#eErr").textContent = "Deleting removes the quiz and its questions. Submitted scores stay in the results."; return; }
    const r = await call(() => API.adminDelete(ADMIN.key, e.id));
    if(r.error){ toast(r.error); return; }
    ADMIN.quizzes = null; toast("Quiz deleted."); location.hash = "#admin";
  };
}
function validate(e){
  if(!e.title) return "Give the quiz a title.";
  if(!e.questions.length) return "Add at least one question.";
  for(let i = 0; i < e.questions.length; i++){
    const q = e.questions[i], n = i + 1;
    q.options = q.options.map(o => o.trim());
    if(!q.text.trim()) return `Question ${n} has no text.`;
    if(q.options.filter(Boolean).length < 2) return `Question ${n} needs at least two options.`;
    if(q.options.some(o => !o)) return `Question ${n} has an empty option. Fill it in or remove it.`;
    if(!(q.correct >= 0 && q.correct < q.options.length)) return `Question ${n}: select the correct option.`;
  }
  return "";
}
function renderQList(){
  const e = ED, box = $("#qList");
  $("#qCount").textContent = e.questions.length;
  box.innerHTML = e.questions.map((q, i) => `<div class="qedit" data-q="${i}"><header><b>Q${i + 1}</b><span class="spacer"></span>
      <button class="btn ghost small" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
      <button class="btn ghost small" data-down="${i}" ${i === e.questions.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
      <button class="btn ghost small" data-del="${i}">Remove</button></header>
    <div class="field"><label for="qt${i}">Question</label><textarea id="qt${i}" data-f="text" rows="2">${esc(q.text)}</textarea></div>
    <div class="field"><label>Options (select the correct one)</label>
      ${q.options.map((o, j) => `<div class="oprow"><input type="radio" name="corr${i}" id="c${i}_${j}" data-corr="${j}" ${q.correct === j ? "checked" : ""} aria-label="Option ${LET[j]} is correct">
        <span class="l">${LET[j]}</span><input type="text" id="o${i}_${j}" data-opt="${j}" value="${esc(o)}" placeholder="Option ${LET[j]}">
        <button class="btn ghost small" data-rmopt="${j}" ${q.options.length <= 2 ? "disabled" : ""} aria-label="Remove option ${LET[j]}">✕</button></div>`).join("")}
      ${q.options.length < 6 ? `<button class="btn ghost small" data-addopt="1" style="align-self:flex-start">+ Add option</button>` : ""}</div>
    <div class="grid2"><div class="field"><label for="qe${i}">Explanation (shown in the answer review)</label><input type="text" id="qe${i}" data-f="explanation" value="${esc(q.explanation)}"></div>
      <div class="field"><label for="qm${i}">Marks</label><input type="number" id="qm${i}" data-f="marks" min="1" value="${q.marks || 1}"></div></div></div>`).join("");
  box.querySelectorAll(".qedit").forEach(card => {
    const i = +card.dataset.q, q = e.questions[i];
    card.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("input", () => { q[inp.dataset.f] = inp.dataset.f === "marks" ? Math.max(1, parseInt(inp.value, 10) || 1) : inp.value; }));
    card.querySelectorAll("[data-opt]").forEach(inp => inp.addEventListener("input", () => { q.options[+inp.dataset.opt] = inp.value; }));
    card.querySelectorAll("[data-corr]").forEach(r => r.addEventListener("change", () => { q.correct = +r.dataset.corr; }));
    card.querySelectorAll("[data-rmopt]").forEach(b => b.onclick = () => { const j = +b.dataset.rmopt; q.options.splice(j, 1); if(q.correct === j) q.correct = -1; else if(q.correct > j) q.correct--; renderQList(); });
    const ao = card.querySelector("[data-addopt]"); if(ao) ao.onclick = () => { q.options.push(""); renderQList(); };
    card.querySelector("[data-del]").onclick = () => { e.questions.splice(i, 1); renderQList(); };
    const up = card.querySelector("[data-up]"), dn = card.querySelector("[data-down]");
    up.onclick = () => { [e.questions[i - 1], e.questions[i]] = [e.questions[i], e.questions[i - 1]]; renderQList(); };
    dn.onclick = () => { [e.questions[i + 1], e.questions[i]] = [e.questions[i], e.questions[i + 1]]; renderQList(); };
  });
}
function parseTable(text){
  text = String(text || "").replace(/\r/g, "");
  if(!text.trim()) return [];
  const delim = text.includes("\t") ? "\t" : ",";
  const rows = []; let row = [], cell = "", inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else inQ = false; } else cell += ch; }
    else if(ch === '"' && cell === "") inQ = true;
    else if(ch === delim){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); if(row.some(c => c.trim())) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); if(row.some(c => c.trim())) rows.push(row);
  return rows;
}

/* ---------- results ---------- */
async function viewResults(id){
  const qs = await loadAdmin(false); if(!qs) return;
  const quiz = qs.find(q => q.id === id) || { id, title:id, passPercent:60 };
  $("#view").innerHTML = `<div class="panel"><p class="muted">Loading results…</p></div>`;
  const r = await call(() => API.adminResults(ADMIN.key, id));
  if(r.error){ $("#view").innerHTML = `<div class="panel"><p class="err">${esc(r.error)}</p><a class="btn" href="#admin">Back</a></div>`; return; }
  const rows = (r.rows || []).slice().sort((a, b) => String(b.time).localeCompare(String(a.time)));
  const n = rows.length, avg = n ? Math.round(rows.reduce((s, x) => s + Number(x.percent), 0) / n) : 0;
  const passN = rows.filter(x => String(x.passed) === "Yes" || x.passed === true).length;
  const flagged = rows.filter(x => Number(x.fullscreenExits) > 0 || Number(x.tabSwitches) > 0).length;
  let html = `<section class="row" style="justify-content:space-between"><div><div class="eyebrow"><a href="#admin">Coordinator</a> / Results</div>
      <h1 style="font-size:24px">${rich(quiz.title)}</h1></div>
      <div class="row"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="csv" ${n ? "" : "disabled"}>Download CSV</button></div></section>
    <div class="stats"><div class="stat"><b>${n}</b><span>submissions</span></div><div class="stat"><b>${avg}%</b><span>average score</span></div>
      <div class="stat"><b>${n ? passN + "/" + n : "–"}</b><span>passed</span></div><div class="stat"><b>${flagged}</b><span>left full screen or switched tabs</span></div></div>
    <div class="tablewrap"><table class="data"><thead><tr><th>Submitted</th><th>Name</th><th>Emp ID</th><th>Dept</th><th>Score</th><th>%</th><th>Result</th><th>Time taken</th><th>Left full screen</th><th>Tab switches</th></tr></thead><tbody>`;
  if(!n) html += `<tr><td colspan="10" class="wrap muted">No submissions yet. Share the participant link and make sure the quiz is open.</td></tr>`;
  rows.forEach(x => {
    const t = new Date(x.time), ts = isNaN(t) ? esc(x.time) : t.toLocaleString([], { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
    html += `<tr><td>${ts}</td><td>${esc(x.name)}</td><td class="mono">${esc(x.emp)}</td><td>${esc(x.dept)}</td><td class="num">${esc(x.score)}/${esc(x.total)}</td><td class="num">${esc(x.percent)}</td>
      <td><span class="badge ${String(x.passed) === "Yes" || x.passed === true ? "pass" : "fail"}">${String(x.passed) === "Yes" || x.passed === true ? "Pass" : "Fail"}</span></td>
      <td class="num">${x.timeTakenSec !== "" && x.timeTakenSec != null ? fmtTime(x.timeTakenSec) : "–"}</td><td class="num">${esc(x.fullscreenExits || 0)}</td><td class="num">${esc(x.tabSwitches || 0)}</td></tr>`;
  });
  html += `</tbody></table></div><p class="hint">Copy the participant link: <span class="mono">${esc(quizLink(id))}</span> <button class="btn small" id="cp">Copy</button></p>`;
  $("#view").innerHTML = html; math($("#view"));
  $("#refresh").onclick = () => viewResults(id);
  $("#cp").onclick = () => copyText(quizLink(id));
  $("#csv").onclick = () => {
    const head = ["Submitted","Name","Emp ID","Dept","Score","Total","Percent","Passed","Time taken (s)","Left full screen","Tab switches","Answers"];
    const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = [head, ...rows.map(x => [x.time, x.name, x.emp, x.dept, x.score, x.total, x.percent, x.passed, x.timeTakenSec, x.fullscreenExits, x.tabSwitches, x.answers])].map(r => r.map(q).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv" }));
    a.download = slug(quiz.title) + "-results.csv"; document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ---------- boot ---------- */
document.title = CONFIG.APP_TITLE;
$("#appTitle").textContent = CONFIG.APP_TITLE;
$("#appOrg").textContent = CONFIG.ORG;
route();
